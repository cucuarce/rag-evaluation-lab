# Juez semántico de faithfulness (Etapa 3B), evaluación completa de judge-v1. [model] idéntico al smoke. Independiente de las configs A/B y de generación.
# Familia distinta del generador (openai/gpt-oss-120b). La clave se lee de GROQ_API_KEY.

[judge]
name = "full_qwen3.8-27b"
prompt_version = "judge-v1"     # src/rag_lab/faithfulness/judge_prompt.py (sin cambios desde la 3A)
reference_date = "2026-11-01"   # la misma "fecha de hoy" que usó la generación de la Etapa 2

[model]
provider = "groq"
model = "qwen/qwen3.8-27b"
temperature = 0.0
max_completion_tokens = 1536    # incluye razonamiento; una afirmación por solicitud
seed = 7
include_reasoning = false       # el razonamiento no se devuelve ni se guarda
# reasoning_effort: sin definir = valor por defecto del proveedor (no se envía)

[limits]
timeout_s = 60
max_retries = 0                 # sin reintentos: cada caso es como máximo 1 solicitud HTTP
max_retry_after_s = 30
backoff_base_s = 2.0
max_concurrency = 1
min_interval_s = 3.0
max_calls = 39                  # tope autorizado: casos pendientes tras el smoke (los 8 del smoke salen de la caché)
max_total_tokens = 90000        # tope adicional autorizado (tokens contabilizados)
max_consecutive_failures = 2
