[project]
name = "rag-evaluation-lab"
version = "0.1.0"
description = "Laboratorio reproducible de evaluación de retrieval (y luego generación) sobre un corpus ficticio."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5,<1.6",
    "sentence-transformers>=5,<7",
    "rank-bm25==0.2.2",
    "numpy>=2,<3",
    "torch>=2.6",
    "groq>=0.30,<2",
]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.uv]
# Reproducibilidad: ignorar releases posteriores a esta fecha al resolver.
exclude-newer = "2026-11-01T00:00:00Z"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # strings en español (acentos, signos de apertura)
    "SIM905",  # lista de stopwords más legible como texto + split()
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests que cargan el modelo de embeddings (lentos, requieren descarga previa)"]
